<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Position Size Calculator</title>
    <style>
        :root {
            --primary-green: #27ae60;
            --primary-red: #e74c3c;
            --dark-bg: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
            --accent: #f1c40f;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 350px;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-radius: 8px;
            overflow: hidden;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            background: #444;
            font-weight: bold;
            transition: 0.3s;
        }

        .tab.active[data-type="long"] { background-color: var(--primary-green); }
        .tab.active[data-type="short"] { background-color: var(--primary-red); }

        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #bbb; }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #1a1a1a;
            color: white;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: var(--accent); }

        button#calcBtn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn-long { background-color: var(--primary-green); }
        .btn-short { background-color: var(--primary-red); }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #111;
            text-align: center;
            display: none;
            border: 1px dashed #444;
            position: relative;
        }

        .result-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 5px 0;
        }

        .result-value {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--accent);
        }

        .copy-btn {
            background: #444;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        #toast {
            visibility: hidden;
            background-color: var(--accent);
            color: #000;
            text-align: center;
            border-radius: 4px;
            padding: 5px;
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            font-weight: bold;
            width: 100px;
        }
        #toast.show { visibility: visible; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align: center; margin-bottom: 20px; font-size: 1.2rem;">PRO CALC 1R</h2>
    
    <div class="tabs">
        <div class="tab active" data-type="long" onclick="setMode('long')">LONG</div>
        <div class="tab" data-type="short" onclick="setMode('short')">SHORT</div>
    </div>

    <div class="input-group">
        <label>Vốn (USDT)</label>
        <input type="number" id="capital" value="100">
    </div>
    <div class="input-group">
        <label>Risk (%)</label>
        <input type="number" id="risk" value="2">
    </div>
    <div class="input-group">
        <label>Entry Price</label>
        <input type="number" id="entry" step="any" placeholder="Nhập giá vào..." autofocus>
    </div>
    <div class="input-group">
        <label>Stop Loss</label>
        <input type="number" id="sl" step="any" placeholder="Nhập giá dừng lỗ...">
    </div>

    <button id="calcBtn" class="btn-long" onclick="calculate()">TÍNH TOÁN LONG</button>

    <div id="result">
        <div style="font-size: 0.8rem; color: #888;">Size lệnh (USDT):</div>
        <div class="result-row">
            <span id="posSize" class="result-value">0</span>
            <button class="copy-btn" onclick="copyToClipboard()">Copy</button>
        </div>
        <div id="leverageInfo" style="font-size: 0.75rem; color: #666; margin-top: 5px;"></div>
        <div id="toast">Đã copy!</div>
    </div>
</div>

<script>
    let mode = 'long';
    let rawValue = 0;

    function setMode(type) {
        mode = type;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelector(`.tab[data-type="${type}"]`).classList.add('active');
        
        const btn = document.getElementById('calcBtn');
        btn.className = type === 'long' ? 'btn-long' : 'btn-short';
        btn.innerText = `TÍNH TOÁN ${type.toUpperCase()}`;
        document.getElementById('result').style.display = 'none';
    }

    function calculate() {
        const capital = parseFloat(document.getElementById('capital').value);
        const riskPercent = parseFloat(document.getElementById('risk').value);
        const entry = parseFloat(document.getElementById('entry').value);
        const sl = parseFloat(document.getElementById('sl').value);

        if (!capital || !riskPercent || !entry || !sl) {
            alert("Vui lòng điền giá Entry và SL!");
            return;
        }

        if (mode === 'long' && sl >= entry) { alert("LONG: SL phải < Entry!"); return; }
        if (mode === 'short' && sl <= entry) { alert("SHORT: SL phải > Entry!"); return; }

        const riskAmount = capital * (riskPercent / 100);
        const priceDiff = Math.abs(entry - sl);
        
        rawValue = (riskAmount / priceDiff) * entry;
        const leverage = rawValue / capital;

        document.getElementById('result').style.display = 'block';
        document.getElementById('posSize').innerText = rawValue.toLocaleString(undefined, {maximumFractionDigits: 2});
        document.getElementById('leverageInfo').innerText = `Đòn bẩy yêu cầu: x${leverage.toFixed(2)}`;
    }

    function copyToClipboard() {
        const textToCopy = rawValue.toFixed(2);
        navigator.clipboard.writeText(textToCopy).then(() => {
            const toast = document.getElementById('toast');
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 1500);
        });
    }
</script>

</body>
</html>
